name: Release Readiness

on:
  workflow_call:
    inputs:
      run_extended:
        description: Run robustness and supply-chain jobs.
        required: false
        default: false
        type: boolean

# Cancel in-progress runs on PRs and pushes, but let manual/scheduled runs
# complete fully — those trigger the expensive robustness and supply-chain gates.
concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Gate 1: critical security-sensitive crates ──────────────────────────────
  release-critical-tests:
    name: Critical release tests (core, mls, transport)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-critical-${{ runner.os }}
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-nextest@0.9.137
          fallback: none

      - name: Fetch deps (warm cache)
        run: |
          for i in 1 2 3; do
            cargo fetch --locked && exit 0
            echo "cargo fetch failed (attempt $i), retrying..."
            sleep 5
          done
          echo "cargo fetch failed after retries"
          exit 1

      # Nextest reports the package, test binary, and test name for attribution
      # while scheduling the independent critical binaries concurrently.
      - name: Test critical crates (all features)
        run: |
          set +e
          cargo nextest run \
            -p spex-core \
            -p spex-mls \
            -p spex-transport \
            --locked \
            --all-features \
            --profile ci
          status=$?
          set -e
          if [[ -f target/nextest/ci/junit.xml ]]; then
            cp target/nextest/ci/junit.xml target/nextest/ci/junit-critical.xml
          fi
          exit "${status}"

      - name: Doc tests for critical crates
        run: |
          cargo test \
            -p spex-core \
            -p spex-mls \
            -p spex-transport \
            --locked \
            --all-features \
            --doc

      - name: Upload critical test timing report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-critical-test-timings
          path: target/nextest/ci/junit-critical.xml
          if-no-files-found: error
          retention-days: 14

  # ── Gate 2: documentation quality and static analysis ───────────────────────
  release-docs-and-quality:
    name: Docs and quality gates (fmt, clippy, doc, release script)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust (fmt + clippy)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-docs-${{ runner.os }}
          cache-on-failure: true

      - name: Fetch deps (warm cache)
        run: |
          for i in 1 2 3; do
            cargo fetch --locked && exit 0
            echo "cargo fetch failed (attempt $i), retrying..."
            sleep 5
          done
          echo "cargo fetch failed after retries"
          exit 1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --locked --all-features -- -D warnings

      - name: Check docs compile
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Release gate docs
        run: ./scripts/release_gate_docs.sh

  # ── Gate 3: failure-path / negative behavior validation ─────────────────────
  release-negative-gate:
    name: Negative gate (failure-path validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate block-on-failure behavior
        run: ./scripts/release_gate_negative_test.sh

  # ── Gate 4: full robustness suite + fuzz smoke (manual / weekly only) ────────
  release-robustness:
    if: inputs.run_extended
    name: Robustness and fuzz smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install Rust (nightly — required for cargo-fuzz)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Separate key: nightly toolchain produces a different artifact tree.
          shared-key: release-robustness-${{ runner.os }}-nightly
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-nextest@0.9.137
          fallback: none

      - name: Fetch deps (warm cache)
        run: |
          for i in 1 2 3; do
            cargo fetch --locked && exit 0
            echo "cargo fetch failed (attempt $i), retrying..."
            sleep 5
          done
          echo "cargo fetch failed after retries"
          exit 1

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Crate-level robustness suites
        run: |
          cargo nextest run --workspace --locked --profile ci
          cargo test --workspace --locked --doc

      - name: Fuzz smoke (deterministic 30 s per target, seed=1)
        run: |
          set -euo pipefail
          for target_file in fuzz/fuzz_targets/*.rs; do
            target_name="$(basename "${target_file}" .rs)"
            echo "==> Fuzz smoke: ${target_name}"
            cargo +nightly fuzz run "${target_name}" --fuzz-dir fuzz -- -max_total_time=30 -seed=1
          done

  # ── Gate 5: supply-chain audit (manual / weekly only) ────────────────────────
  release-supply-chain:
    if: inputs.run_extended
    name: Supply chain security (audit + deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      # rust-cache also caches ~/.cargo/bin, so cargo-audit and cargo-deny are
      # restored on subsequent runs without recompilation.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-supply-chain-${{ runner.os }}
          cache-on-failure: true

      # taiki-e/install-action downloads pre-built binaries — much faster than
      # compiling cargo-audit and cargo-deny from source.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit (CVE / RUSTSEC advisory check)
        run: |
          # The lockfile retains optional libp2p DNS/mDNS packages although their
          # features are disabled. Keep the approved exceptions constrained to
          # inactive feature paths; see docs/security-advisory-exceptions.md.
          for package in libp2p-dns libp2p-mdns; do
            active_path="$(cargo tree --locked -e features -i "${package}" 2>/dev/null || true)"
            if [[ -n "${active_path}" ]]; then
              echo "::error::${package} is active; its advisory exception is invalid."
              echo "${active_path}"
              exit 1
            fi
          done
          cargo audit --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 --no-deps >/dev/null
          cargo audit --file fuzz/Cargo.lock --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119

      - name: cargo deny check (licenses + bans + advisories + sources)
        run: cargo deny check

[package]
name = "spex-bridge"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "HTTP bridge relay for SPEX with explicit validation and abuse controls."
repository = "https://github.com/richardikeda/SPEX"
homepage = "https://github.com/richardikeda/SPEX"
readme = "../../README.md"
keywords = ["protocol", "security", "bridge", "http", "messaging"]
categories = ["network-programming", "web-programming::http-server", "cryptography"]

[dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
] }
base64 = "0.23.1"
ed25519-dalek = "3.0"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
parking_lot = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.8", optional = true, default-features = false, features = [
  "cargo_bench_support",
] }

spex-core = { version = "0.1.1", path = "../../spex-core" }

[features]
default = []
benchmarks = ["dep:criterion"]

[[bench]]
name = "db_bench"
harness = false
required-features = ["benchmarks"]

[dev-dependencies]
proptest = "1"
ed25519-dalek = "3.0"
ciborium = "0.2"
spex-mls = { version = "0.1.0", path = "../spex-mls" }
spex-transport = { version = "0.1.0", path = "../spex-transport" }
tempfile = "3"
tower = "0.5"
